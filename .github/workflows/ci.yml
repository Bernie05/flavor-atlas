# The same checks CLAUDE.md asks for before every commit, run by GitHub on
# every push and pull request, so they hold no matter who (or what) wrote the code.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: this workflow only checks, it never writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The single-file demo is what the phone preview ships, so it must build too.
      - run: npm run build:demo

  # The app in a real browser against the real server (auth gateway, json-server),
  # on a throwaway copy of the seed: admin flows, focus, and what a visitor can't do.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The Chromium that matches the pinned @playwright/test, with the system libraries it needs.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # On failure: the HTML report, with a trace and screenshot of each failing test.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
